# Optional: deploy to GitHub Pages.
#
# Cloudflare Pages is the recommended host (see README) and needs no workflow —
# it builds from the repo automatically. Keep this file if you'd rather use
# GitHub Pages, or delete it.
#
# Before enabling: Settings → Pages → Source → "GitHub Actions".
# If the repo is NOT named `<username>.github.io`, the site is served from a
# subpath, so set `base: '/<repo-name>'` in astro.config.mjs or every link
# will 404.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
