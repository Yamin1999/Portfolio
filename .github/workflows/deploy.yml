# Deploys to GitHub Pages on every push to main — including the commits Sveltia
# CMS makes when you save from /admin.
#
# One-time setup: Settings → Pages → Source → "GitHub Actions".
#
# This repo is named Yamin1999.github.io, so the site is served from the root and
# no `base` path is needed in astro.config.mjs. That stops being true if the repo
# is ever renamed.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
